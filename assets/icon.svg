<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Acoustic guitar in front of the Minneapolis + St. Paul skyline.
       Master art for the iOS icon: see scripts/make-icons.py -->
  <defs>
    <!-- Guitar silhouette, drawn upright around the body's center. -->
    <g id="guitar-shape">
      <circle cx="0" cy="0" r="30"/>
      <circle cx="0" cy="-40" r="22"/>
      <rect x="-5" y="-120" width="10" height="76"/>
      <rect x="-8.5" y="-146" width="17" height="30" rx="3"/>
    </g>
  </defs>
  <rect width="180" height="180" fill="#ffffff"/>

  <g fill="#000000">
    <!-- Minneapolis (left): Foshay, IDS, Wells Fargo Center, Capella, low buildings -->
    <path d="M12 154 L13.5 84 L16.5 76 L19.5 84 L21 154 Z"/>
    <rect x="15.9" y="64" width="1.2" height="13"/>
    <path d="M24 154 V48 H26 V44 H28 V40 H38 V44 H40 V48 H42 V154 Z"/>
    <path d="M45 154 V64 H47 V60 H48.5 L51.5 50 L54.5 60 H56 V64 H58 V154 Z"/>
    <rect x="60.5" y="62" width="10" height="92"/>
    <rect x="70" y="104" width="22" height="50"/>
    <!-- St. Paul (right): a downtown tower, then the State Capitol dome -->
    <rect x="110" y="78" width="13" height="76"/>
    <rect x="115.9" y="70" width="1.2" height="9"/>
    <rect x="123" y="118" width="8" height="36"/>
    <rect x="130" y="134" width="42" height="20"/>
    <rect x="142" y="123" width="18" height="11"/>
    <path d="M143 123 A8 8 0 0 1 159 123 Z"/>
    <rect x="149.7" y="105" width="2.6" height="10"/>
    <!-- ground -->
    <rect x="6" y="152" width="168" height="4"/>
  </g>
  <circle cx="65.5" cy="56" r="5" fill="none" stroke="#000000" stroke-width="2.4"/>

  <!-- Guitar: a white halo first so it stands apart from the buildings, then the guitar. -->
  <g transform="translate(62 124) rotate(40) scale(0.95)">
    <use href="#guitar-shape" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <use href="#guitar-shape" fill="#000000"/>
    <g fill="#000000">
      <circle cx="-11.5" cy="-140" r="3"/><circle cx="-11.5" cy="-131" r="3"/><circle cx="-11.5" cy="-122" r="3"/>
      <circle cx="11.5" cy="-140" r="3"/><circle cx="11.5" cy="-131" r="3"/><circle cx="11.5" cy="-122" r="3"/>
    </g>
    <g fill="#ffffff">
      <circle cx="0" cy="-26" r="9.5"/>
      <rect x="-12" y="9" width="24" height="5" rx="1.5"/>
    </g>
    <g stroke="#ffffff">
      <path d="M-5 -58 H5 M-5 -70 H5 M-5 -82 H5 M-5 -94 H5 M-5 -106 H5" stroke-width="1.4"/>
      <path d="M-3 11 V-118 M-1 11 V-118 M1 11 V-118 M3 11 V-118" stroke-width=".7"/>
    </g>
  </g>
</svg>
